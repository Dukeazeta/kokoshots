# Revyl CLI Configuration
# Generated by: revyl init
# Edit these settings or run: revyl config set <key> <value>
# Docs: https://docs.revyl.ai/cli/hot-reload

project:
    name: kokoshots
build:
    system: Flutter
    command: flutter build apk --debug
    output: build/app/outputs/flutter-apk/app-debug.apk
    platforms:
        android:
            command: flutter build apk --debug
            output: build/app/outputs/flutter-apk/app-debug.apk
            app_id: 9e5b228e-332f-4670-98f6-0047fc5b30fb
        ios:
            command: flutter build ios --simulator
            output: build/ios/iphonesimulator/*.app
defaults:
    open_browser: false
    timeout: 1800
